[global]
type=global
user_agent=Asterisk-VoIP-Lab
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
local_net=192.168.56.0/24
[endpoint-template](!)
type=endpoint
context=from-internal
disallow=all
allow=ulaw,alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
language=fr
timers=yes
[aor-template](!)
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=0
[auth-template](!)
type=auth
auth_type=userpass
[1000](endpoint-template)
auth=auth1000
aors=1000
callerid=Utilisateur 1000 <1000>
[1000](aor-template)
[auth1000](auth-template)
username=1000
password=CHANGE_ME
[1001](endpoint-template)
auth=auth1001
aors=1001
callerid=Utilisateur 1001 <1001>
[1001](aor-template)
[auth1001](auth-template)
username=1001
password=CHANGE_ME
